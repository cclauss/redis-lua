name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua-version: ["5.1", "5.2", "5.3", "5.4", luajit]
        redis-image: [redis:7-alpine]
        include:
          - lua-version: "5.5"
            redis-image: redis:8-alpine

    services:
      redis:
        image: ${{ matrix.redis-image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua-version }}

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install test dependencies
        run: |
          luarocks install busted
          luarocks install luasocket
          luarocks install luasec

      - name: Start a TLS-enabled Redis server
        run: |
          ./test/gen-tls-certs.sh tls
          docker run -d --name redis-tls --network host \
            -v "$PWD/tls:/tls:ro" \
            redis:7-alpine redis-server --port 0 --tls-port 6390 \
            --tls-cert-file /tls/server.crt --tls-key-file /tls/server.key \
            --tls-ca-cert-file /tls/ca.crt --tls-auth-clients no

      - name: Run test suite
        run: busted
        env:
          REDIS_TLS_PORT: 6390
          REDIS_TLS_CAFILE: tls/ca.crt
